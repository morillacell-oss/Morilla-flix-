.sectionheader{margin:38px 0 5px}.gridmovies{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:17px}.searchbar{display:flex;gap:10px;align-items:center;margin-top:24px}.searchbar input{width:100%;border-radius:12px;border:1px solid #3d3d43;background:#151519;padding:16px;color:#fff;font-size:16px}
.breadcrumb{border:0;color:#c4c4ce;background:transparent;padding:16px 0}.detailshero{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,42%);align-items:center;gap:30px;padding:28px 0 45px}.detailshero .cover{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:16px;box-shadow:0 0 50px rgba(200,0,0,.12)}.detailshero h1{font:900 clamp(35px,5vw,68px)/1 Outfit;margin:15px 0 17px}.detailshero p{line-height:1.7;color:#d1d1d7}.smallmuted{color:var(--muted);font-size:12px}.box{background:#111115;border:1px solid #28282e;border-radius:15px;padding:21px;margin:18px 0}.box h3{margin-top:0}.episode{display:flex;align-items:center;gap:14px;padding:13px;border-radius:10px;border:1px solid #303035;background:#17171b;color:#fff;text-align:left;width:100%;margin-bottom:9px}.episode:hover{border-color:var(--red)}.episode .number{background:#3a1518;border-radius:8px;padding:14px;color:#ff7b82;font-weight:900}.stars{display:flex;gap:4px}.star{border:0;background:transparent;color:#666;font-size:30px;padding:0 4px}.star.selected{color:#ffbb41}
.modalwrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.88);padding:18px}.modal{width:min(100%,850px);max-height:95vh;overflow:auto;background:#141418;border:1px solid #414146;border-radius:18px;padding:20px;box-shadow:0 22px 90px #000}.modal h2{font:800 25px Outfit;margin:0 0 15px}.modaltop{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal video{width:100%;aspect-ratio:16/9;background:#000;margin-top:10px}.videoembed{aspect-ratio:16/9;width:100%;border:0}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0;color:#ddd;font-size:13px;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid #45454b;background:#09090c;color:white;padding:12px;border-radius:9px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 12px}.formwide{grid-column:1/-1}.notice{padding:12px;border-radius:10px;background:#261819;border:1px solid #6d2529;color:#ffd0d1;font-size:13px}.notice.ok{background:#10301b;border-color:#23613a;color:#ccffdb}.profilegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.profilecard{background:#1e1e22;border:1px solid #38383c;border-radius:14px;padding:21px;text-align:center;color:#fff}.profilecard.active{border-color:#f14049}.avatar{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 10px;border-radius:17px;background:linear-gradient(135deg,#ec202d,#5e1117);font:900 26px Outfit}.sponsor{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:17px 21px;border:1px solid #35353a;background:#0f0f12;border-radius:12px;margin:22px 0}.sponsor h3{margin:5px 0 3px;font-size:16px}.sponsor p{color:var(--muted);margin:4px 0;font-size:13px}.sponsor .sptag{font-size:10px;letter-spacing:1px;color:#aaa}footer{padding:40px clamp(16px,4vw,70px);border-top:1px solid #27272a;color:#96969e;font-size:12px;line-height:1.7}.float{position:fixed;bottom:22px;right:22px;z-index:25;background:#9f101a;color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:800;box-shadow:0 9px 25px #0009}.hidden{display:none!important}.loading{padding:40px 0;color:#999}.toast{position:fixed;z-index:60;bottom:20px;left:50%;transform:translateX(-50%);padding:13px 20px;background:#29292e;border:1px solid #5b5b62;border-radius:11px;box-shadow:0 12px 35px #000;color:#fff;max-width:90vw;text-align:center}
@media(max-width:840px){header{gap:6px;flex-wrap:wrap;padding:10px 14px}.brand svg{height:34px;width:43px}.brandname{font-size:22px}.headeractions{margin-left:auto}nav{order:3;width:100%;overflow:auto;justify-content:space-between}.nav{padding:10px;font-size:12px;white-space:nowrap}.hero{min-height:520px;padding:55px 22px 38px}.herotitle{letter-spacing:-2px}.hero:after{background:linear-gradient(0deg,#000 0%,rgba(0,0,0,.45) 90%),linear-gradient(90deg,#0008,transparent)}.shelf{grid-auto-columns:185px}.detailshero{grid-template-columns:1fr}.detailshero .cover{order:-1}.formgrid{grid-template-columns:1fr}.sponsor{align-items:start;flex-direction:column}}@media(max-width:420px){.nav{font-size:11px;padding:9px 5px}.brandname{font-size:19px}.hero{min-height:500px}.btn{padding:11px 14px}.gridmovies{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.gridmovies .movie .details{padding:9px}.gridmovies .movie h3{font-size:13px}}

<body>
<header><a class="brand" href="#inicio" aria-label="Morilla Flix início">
<img class="gorilla-mark" src="assets/gorilla.svg" alt="Gorila vermelho em quatro patas">
<span class="brandname">MORILLA<br><em>FLIX</em></span></a>
<nav id="navigation" aria-label="Navegação principal"><button class="nav active" data-nav="inicio">Início</button><button class="nav" data-nav="filmes">Filmes</button><button class="nav" data-nav="series">Séries</button><button class="nav" data-nav="minha-lista">Minha Lista</button><button class="nav" data-nav="explorar">Explorar</button></nav>
<div class="headeractions"><button class="round" id="searchIcon" aria-label="Pesquisar">⌕</button><button class="profilebtn" id="profileButton">● Perfil</button></div></header>
<div id="app" role="main"><div class="skeleton" role="status" aria-label="Carregando catálogo"><div class="line short"></div><div class="line wide"></div><div class="line"></div></div></div>
<footer><strong>MORILLA FLIX</strong> · Um espaço para descobrir cinema independente e obras abertas.<br>Todos os vídeos precisam ter autorização de exibição. Créditos e licenças são exibidos nos títulos. Dados pessoais deste navegador não são enviados ao catálogo. <a href="#admin" id="adminLink">Administração</a>.</footer>
<div id="overlay"></div>
<script type="module">
const URL_BASE="https://bpipdcbwlllwnvolorfp.supabase.co";
const API_KEY="sb_publishable_IrhYV4Ma_ENch1cvlTSy2g_4zTg5qkk";
const app=document.getElementById("app"),overlay=document.getElementById("overlay");
let titles=[],episodes=[],sponsors=[],featured=null,adminToken=null,adminUser=null,adminMode=false,selectedGenre="Todos",loadError=null;
const storeKey="morillaflix_v1";
function loadStore(){try{let x=JSON.parse(localStorage.getItem(storeKey));return x&&typeof x==="object"?x:{};}catch{return {};}}
let store=Object.assign({profiles:[{id:"principal",name:"Principal"}],active:"principal",data:{}},loadStore());
function saveStore(){localStorage.setItem(storeKey,JSON.stringify(store));}
function profile(){return store.profiles.find(p=>p.id===store.active)||store.profiles[0];}
function pdata(){store.data[store.active]??={favorites:[],history:{},ratings:{}};return store.data[store.active];}
function safe(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function urlSafe(raw){try{let u=new URL(raw);return u.protocol==="https:"?u.href:"";}catch{return "";}}
function img(raw){return urlSafe(raw)||"";}
function toast(t){let e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3300);}
async function api(path,options={}){const headers={"apikey":API_KEY,"Content-Type":"application/json",...(adminToken?{'Authorization':'Bearer '+adminToken}:{}),'Prefer':'return=representation',...options.headers};const res=await fetch(URL_BASE+path,{...options,headers});let data;try{data=await res.json()}catch{data=null}if(!res.ok)throw Error(data?.message||data?.error_description||data?.msg||"Erro ao acessar o servidor ("+res.status+")");return data;}
async function refresh(){
try{
 const [a,b,c]=await Promise.all([
 api("/rest/v1/titles?select=*&order=created_at.desc"),
 api("/rest/v1/episodes?select=*&order=season_number.asc,episode_number.asc"),
 api("/rest/v1/sponsors?select=*&order=created_at.desc")
 ]);
 titles=a||[];episodes=b||[];sponsors=c||[];
 featured=titles.find(x=>x.featured)||titles[0]||null;
 loadError=null;
 try{localStorage.setItem("morilla_catalog_cache_v2",JSON.stringify({titles,episodes,sponsors}));}catch{}
}catch(e){
 console.error("Morilla Flix: erro no catálogo",e);
 loadError=e.message;
 try{
 const cached=JSON.parse(localStorage.getItem("morilla_catalog_cache_v2")||"null");
 if(cached?.titles?.length){titles=cached.titles;episodes=cached.episodes||[];sponsors=cached.sponsors||[];featured=titles.find(x=>x.featured)||titles[0];toast("Exibindo catálogo salvo. Sem conexão com o Supabase.");}
 }catch{}
}
render();
}
function titleBy(id){return titles.find(x=>x.id===id);}
function mediaCard(t){let score=Object.values(store.data).flatMap(x=>x.ratings?.[t.id]?[x.ratings[t.id]]:[]),rate=score.length?(score.reduce((a,b)=>a+b,0)/score.length).toFixed(1):"";
return '<button class="movie" data-title="'+safe(t.id)+'"><img class="thumb" loading="lazy" src="'+safe(img(t.poster_url||t.backdrop_url))+'" alt="Capa de '+safe(t.name)+'" onerror="this.style.opacity=.3"><span class="chip">'+(t.kind==="series"?"SÉRIE":"FILME")+'</span>'+(rate?'<span class="badgerating">★ '+rate+'</span>':"")+'<div class="details"><h3>'+safe(t.name)+'</h3><p>'+safe(t.release_year||"")+" · "+safe(t.genre)+'</p></div></button>';}
function shelf(label,list){return list.length?'<section class="section"><h2 class="heading">'+safe(label)+'</h2><div class="shelf">'+list.map(mediaCard).join("")+'</div></section>':"";}
function sponsorBlock(){const s=sponsors.find(x=>x.is_active);if(!s)return"";const link=urlSafe(s.destination_url);return '<section class="sponsor"><div><span class="sptag">CONTEÚDO PATROCINADO</span><h3>'+safe(s.heading)+'</h3><p>'+safe(s.description)+'</p></div>'+(link?'<a class="btn small outline" target="_blank" rel="noopener noreferrer sponsored" href="'+safe(link)+'">Conhecer patrocinador ↗</a>':"")+'</section>';}
function home(){if(!featured)return '<div class="content"><div class="alertbox"><div class="eyebrow">MORILLA FLIX</div><h2>'+(loadError?'Não foi possível carregar os filmes':'O catálogo está sendo preparado')+'</h2><p>'+(loadError?'Erro de conexão: '+safe(loadError)+' — tente novamente em instantes.':'Ainda não há filmes publicados.')+'</p><button class="btn red" id="retryCatalog">↻ Tentar novamente</button></div></div>';const f=featured;const cont=titles.filter(t=>pdata().history[t.id]?.position>5);const recom=[...titles].sort((a,b)=>recommendScore(b)-recommendScore(a));return '<section class="hero"><div class="heroimage" style="background-image:url(&quot;'+safe(img(f.backdrop_url||f.poster_url))+'&quot;)"></div><div class="herotext"><div class="eyebrow">✦ SEU CINEMA, SEU UNIVERSO</div><h1 class="herotitle">'+safe(f.name)+'</h1><div class="meta"><span>'+safe(f.release_year||"")+'</span><span class="pill">'+safe(f.age_rating)+'</span><span>'+safe(f.genre)+'</span><span>HD</span></div><p>'+safe(f.description)+'</p><div class="actions"><button class="btn red" data-watch="'+safe(f.id)+'">▶ Assistir agora</button><button class="btn" data-title="'+safe(f.id)+'">ⓘ Mais informações</button><button class="btn outline" data-favorite="'+safe(f.id)+'">'+(pdata().favorites.includes(f.id)?"✓ Na lista":"+ Minha lista")+'</button></div></div></section><div class="content">'+shelf("Continue assistindo",cont)+shelf("Em destaque",titles.filter(t=>t.featured))+shelf("Escolhidos para você",recom.filter(t=>t.kind==="movie"))+shelf("Séries e coleções",titles.filter(t=>t.kind==="series"))+shelf("Descubra mais",titles)+sponsorBlock()+'</div>';}
function recommendScore(t){let d=pdata(),ratings=Object.entries(d.ratings),favs=d.favorites.map(titleBy).filter(Boolean),liked=ratings.filter(([id,n])=>n>=4).map(([id])=>titleBy(id)).filter(Boolean),same=[...favs,...liked];return (same.filter(x=>x.genre===t.genre).length*3)+(t.featured?2:0)+(d.history[t.id]?1:0)+(d.favorites.includes(t.id)?-5:0);}
function catalog(view){let l=titles.filter(t=>view==="filmes"?t.kind==="movie":view==="series"?t.kind==="series":view==="minha-lista"?pdata().favorites.includes(t.id):true);let query=document.getElementById("query")?.value||"";if(selectedGenre!=="Todos")l=l.filter(x=>x.genre===selectedGenre);if(query)l=l.filter(x=>(x.name+" "+x.genre+" "+x.description).toLowerCase().includes(query.toLowerCase()));return l;}
function gallery(view){let titleMap={filmes:"Filmes",series:"Séries","minha-lista":"Minha Lista",explorar:"Explorar o catálogo"};let genres=["Todos",...new Set(titles.map(t=>t.genre))];let preserved=window.__searchValue||"";return '<div class="content"><div class="sectionheader"><div class="eyebrow">MORILLA FLIX</div><h1 style="font:900 clamp(34px,5vw,54px) Outfit;margin:7px 0">'+safe(titleMap[view])+'</h1></div><div class="searchbar"><input id="query" type="search" autocomplete="off" placeholder="Busque pelo nome, gênero ou descrição..." value="'+safe(preserved)+'" aria-label="Buscar filmes e séries"></div><div class="filterrow">'+genres.map(g=>'<button class="filter '+(selectedGenre===g?"active":"")+'" data-genre="'+safe(g)+'">'+safe(g)+'</button>').join("")+'</div><div id="catalogGrid"></div></div>';}
function drawGallery(view){let l=catalog(view);let target=document.getElementById("catalogGrid");if(target)target.innerHTML=l.length?'<div class="gridmovies">'+l.map(mediaCard).join("")+'</div>':'<div class="empty">Nenhum título encontrado. Experimente outra busca ou categoria.</div>';}
function details(id){const t=titleBy(id);if(!t)return home();const d=pdata(),stars=d.ratings[t.id]||0,list=episodes.filter(e=>e.title_id===id);return '<div class="content"><button class="breadcrumb" data-nav="inicio">← Voltar ao início</button><div class="detailshero"><div><div class="eyebrow">'+(t.kind==="series"?"SÉRIE ORIGINAL DO CATÁLOGO":"CINEMA PARA TODOS")+'</div><h1>'+safe(t.name)+'</h1><div class="meta"><span>'+safe(t.release_year||"")+'</span><span class="pill">'+safe(t.age_rating)+'</span><span>'+safe(t.genre)+'</span><span>'+safe(t.duration_minutes||"")+" min"+'</span></div><p>'+safe(t.description)+'</p><div class="actions"><button class="btn red" data-watch="'+safe(t.id)+'">▶ '+(d.history[t.id]?.position>5?"Continuar assistindo":"Assistir agora")+'</button><button class="btn outline" data-favorite="'+safe(t.id)+'">'+(d.favorites.includes(t.id)?"✓ Remover da lista":"+ Minha lista")+'</button></div><p class="smallmuted" style="margin-top:21px">'+safe(t.credit||"Verifique os direitos de exibição.")+'</p></div><img class="cover" src="'+safe(img(t.backdrop_url||t.poster_url))+'" alt="'+safe(t.name)+'"></div>'+(list.length?'<section class="box"><h2>Temporadas e episódios</h2>'+list.map(e=>'<button class="episode" data-episode="'+safe(e.id)+'"><span class="number">'+e.season_number+'×'+e.episode_number+'</span><span><strong>'+safe(e.name)+'</strong><br><span class="smallmuted">'+safe(e.description)+' · '+safe(e.duration_minutes||"")+' min</span></span><span style="margin-left:auto">▶</span></button>').join("")+'</section>':"")+'<section class="box"><h3>Sua avaliação</h3><p class="smallmuted">As notas são pessoais e ficam somente neste navegador.</p><div class="stars">'+[1,2,3,4,5].map(n=>'<button class="star '+(n<=stars?"selected":"")+'" data-rate="'+safe(t.id)+'" data-value="'+n+'" aria-label="Avaliar com '+n+' estrelas">★</button>').join("")+'</div></section>'+shelf("Você também pode gostar",titles.filter(x=>x.id!==t.id).sort((a,b)=>Number(b.genre===t.genre)-Number(a.genre===t.genre)))+'</div>';}
let currentView="inicio",currentDetails=null;
function render(){document.querySelectorAll("nav .nav").forEach(x=>x.classList.toggle("active",x.dataset.nav===currentView));app.innerHTML=currentDetails?details(currentDetails):currentView==="inicio"?home():gallery(currentView);if(!currentDetails&&currentView!=="inicio")drawGallery(currentView);}
function navigate(v){if(v==="admin"){showAdmin();return}currentDetails=null;currentView=v;selectedGenre="Todos";window.__searchValue="";render();window.scrollTo(0,0);}
function openDetails(id){currentDetails=id;render();window.scrollTo(0,0);}
function favorite(id){let d=pdata();d.favorites=d.favorites.includes(id)?d.favorites.filter(x=>x!==id):[...d.favorites,id];saveStore();render();toast(d.favorites.includes(id)?"Adicionado à sua lista":"Removido da sua lista");}
function rate(id,n){pdata().ratings[id]=n;saveStore();render();toast("Sua avaliação foi salva neste dispositivo.");}
function showModal(content){overlay.innerHTML='<div class="modalwrap" id="modalWrap"><div class="modal" role="dialog" aria-modal="true"><div class="modaltop"><h2>MORILLA <span style="color:var(--red)">FLIX</span></h2><button class="round" data-close aria-label="Fechar">✕</button></div>'+content+'</div></div>';}
function closeModal(){const v=overlay.querySelector("video");if(v)v.pause();overlay.innerHTML="";}function trackVideo(id,video){const d=pdata();let h=d.history[id]||{position:0,percent:0};h.position=video.currentTime||0;h.percent=video.duration?Math.floor(100*video.currentTime/video.duration):0;d.history[id]=h;saveStore();}
function youtubeEmbed(url){try{const u=new URL(url);let id=null;if(u.hostname==="youtu.be")id=u.pathname.slice(1);if(["youtube.com","www.youtube.com","m.youtube.com"].includes(u.hostname)){id=u.searchParams.get("v");if(u.pathname.startsWith("/embed/"))id=u.pathname.split("/")[2]}return /^[a-zA-Z0-9_-]{11}$/.test(id||"")?"https://www.youtube-nocookie.com/embed/"+id:null;}catch{return null;}}
function play(id,episodeId){const t=titleBy(id),e=episodeId?episodes.find(x=>x.id===episodeId):null;if(!t)return;const link=e?.video_url||t.video_url||episodes.find(x=>x.title_id===id)?.video_url;if(!link){toast("Este título ainda não possui vídeo publicado.");return;}const embed=youtubeEmbed(link);if(!embed&&!urlSafe(link)){toast("O vídeo não usa uma URL HTTPS válida.");return;}let body='<h3>'+safe(t.name)+(e?" — "+safe(e.name):"")+'</h3>'+(embed?'<iframe class="videoembed" src="'+safe(embed)+'" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen title="Player de vídeo"></iframe>':'<video id="videoPlayer" playsinline controls autoplay preload="metadata" poster="'+safe(img(t.backdrop_url||t.poster_url))+'" src="'+safe(urlSafe(link))+'"></video>')+'<p class="smallmuted">'+safe(t.credit||"Reprodução de conteúdo autorizado")+'</p>';showModal(body);if(!embed){let v=document.getElementById("videoPlayer");v.addEventListener("loadedmetadata",()=>{const pos=pdata().history[id]?.position;if(pos&&pos<v.duration-8)v.currentTime=pos;});v.addEventListener("timeupdate",()=>{if(Math.floor(v.currentTime)%4===0)trackVideo(id,v)});v.addEventListener("pause",()=>trackVideo(id,v));v.addEventListener("ended",()=>{pdata().history[id]={position:0,percent:100};saveStore()});v.addEventListener("error",()=>toast("O vídeo não pôde ser carregado. Verifique o link e a disponibilidade da origem."));}}
function manageProfiles(){showModal('<h2>Quem está assistindo?</h2><p class="smallmuted">Perfis locais, sem conta. Cada perfil guarda seus próprios favoritos e avaliações neste dispositivo.</p><div class="profilegrid">'+store.profiles.map((p,i)=>'<button class="profilecard '+(p.id===store.active?"active":"")+'" data-profile="'+safe(p.id)+'"><span class="avatar">'+safe(p.name.charAt(0).toUpperCase())+'</span><strong>'+safe(p.name)+'</strong>'+(p.id===store.active?'<div class="smallmuted">Ativo</div>':"")+'</button>').join("")+'</div><div class="field"><label for="newProfile">Novo perfil (até 4)</label><input id="newProfile" maxlength="22" placeholder="Nome do perfil"></div><button class="btn red" id="addProfile" '+(store.profiles.length>=4?"disabled":"")+'>+ Criar perfil</button>');}
function showAdmin(){adminMode=true;showModal('<h2>Painel administrativo</h2><p class="smallmuted">Somente administradores autorizados no Supabase podem gerenciar o conteúdo. Visitantes assistem sem login.</p>'+(!adminToken?'<form id="loginForm"><label class="field">E-mail<input required id="adminEmail" type="email" autocomplete="username"></label><label class="field">Senha<input required id="adminPass" type="password" autocomplete="current-password"></label><button type="submit" class="btn red">Entrar com Supabase</button></form>':adminDashboard()));}
function adminDashboard(){return '<div class="notice ok">Acesso de administrador autenticado.</div><div class="actions" style="margin:12px 0"><button class="btn red" id="newTitle">+ Novo filme/série</button><button class="btn outline" id="newEpisode">+ Episódio</button><button class="btn outline" id="newSponsor">+ Patrocínio</button><button class="btn" id="logoutAdmin">Sair</button></div><h3>Catálogo cadastrado</h3>'+titles.map(t=>'<div class="episode"><div style="flex:1"><strong>'+safe(t.name)+'</strong><div class="smallmuted">'+safe(t.kind)+' · '+(t.published?"Publicado":"Rascunho")+'</div></div><button class="btn small" data-edit="'+safe(t.id)+'">Editar</button><button class="btn small outline" data-remove="'+safe(t.id)+'">Excluir</button></div>').join("")+'<h3>Episódios</h3>'+episodes.map(e=>'<div class="episode"><div style="flex:1"><strong>'+safe(e.name)+'</strong><div class="smallmuted">'+safe(titleBy(e.title_id)?.name)+' · T'+e.season_number+' E'+e.episode_number+'</div></div><button class="btn small" data-edit-episode="'+safe(e.id)+'">Editar</button><button class="btn small outline" data-remove-episode="'+safe(e.id)+'">Excluir</button></div>').join("")+'<h3>Patrocinadores</h3>'+sponsors.map(s=>'<div class="episode"><div style="flex:1"><strong>'+safe(s.heading)+'</strong><div class="smallmuted">'+(s.is_active?"Ativo":"Inativo")+'</div></div><button class="btn small" data-edit-sponsor="'+safe(s.id)+'">Editar</button><button class="btn small outline" data-remove-sponsor="'+safe(s.id)+'">Excluir</button></div>').join("");}
function titleForm(id){let t=id?titleBy(id):{};if(!t)return;showModal('<h2>'+(id?"Editar título":"Novo título")+'</h2><form id="titleForm" data-id="'+safe(id||"")+'"><div class="formgrid">'+field("name","Nome",t.name||"",true)+field("slug","Slug (letras minúsculas e hífens)",t.slug||"",true)+selectField("kind","Tipo",[["movie","Filme"],["series","Série"]],t.kind||"movie")+field("genre","Gênero",t.genre||"Drama",true)+field("release_year","Ano",t.release_year||"",false,"number")+field("duration_minutes","Duração (min)",t.duration_minutes||"",false,"number")+field("age_rating","Classificação",t.age_rating||"L")+field("poster_url","URL HTTPS da capa",t.poster_url||"")+field("backdrop_url","URL HTTPS do banner",t.backdrop_url||"")+field("video_url","URL HTTPS do vídeo",t.video_url||"")+field("credit","Créditos e licenças",t.credit||"")+'<label class="field formwide">Sinopse<textarea name="description" rows="3">'+safe(t.description||"")+'</textarea></label>'+selectField("featured","Destaque",[["true","Sim"],["false","Não"]],String(t.featured||false))+selectField("published","Publicado",[["true","Sim"],["false","Não"]],String(t.published??true))+'</div><p class="smallmuted">Use somente vídeos próprios ou com autorização de exibição. Links MP4/WebM HTTPS e YouTube são aceitos.</p><button class="btn red" type="submit">Salvar título</button></form>');}
function field(name,label,value,required=false,type="text"){return '<label class="field">'+safe(label)+'<input name="'+name+'" type="'+type+'" value="'+safe(value)+'" '+(required?"required":"")+'></label>';}
function selectField(name,label,options,value){return '<label class="field">'+safe(label)+'<select name="'+name+'">'+options.map(([key,name])=>'<option value="'+safe(key)+'" '+(String(key)===String(value)?"selected":"")+'>'+safe(name)+'</option>').join("")+'</select></label>';}
function episodeForm(id){let e=id?episodes.find(x=>x.id===id):{};if(!e)return;showModal('<h2>'+(id?"Editar episódio":"Novo episódio")+'</h2><form id="episodeForm" data-id="'+safe(id||"")+'"><div class="formgrid">'+selectField("title_id","Série",titles.filter(t=>t.kind==="series").map(t=>[t.id,t.name]),e.title_id||"")+field("name","Nome do episódio",e.name||"",true)+field("season_number","Temporada",e.season_number||1,true,"number")+field("episode_number","Episódio",e.episode_number||1,true,"number")+field("duration_minutes","Duração (min)",e.duration_minutes||"",false,"number")+field("video_url","URL HTTPS do vídeo",e.video_url||"")+'<label class="field formwide">Sinopse<textarea name="description" rows="3">'+safe(e.description||"")+'</textarea></label>'+selectField("published","Publicado",[["true","Sim"],["false","Não"]],String(e.published??true))+'</div><button class="btn red" type="submit">Salvar episódio</button></form>');}
function sponsorForm(id){let s=id?sponsors.find(x=>x.id===id):{};if(!s)return;showModal('<h2>'+(id?"Editar patrocínio":"Novo patrocínio")+'</h2><form id="sponsorForm" data-id="'+safe(id||"")+'">'+field("heading","Título",s.heading||"",true)+field("description","Descrição",s.description||"")+field("destination_url","URL HTTPS do anunciante",s.destination_url||"")+selectField("is_active","Ativo",[["true","Sim"],["false","Não"]],String(s.is_active||false))+'<p class="smallmuted">Anúncios visíveis somente em cartão identificado. Sem popups ou redirecionamentos forçados.</p><button class="btn red" type="submit">Salvar patrocínio</button></form>');}
function dataForm(form){let d=Object.fromEntries(new FormData(form));for(let k of Object.keys(d)){if(["featured","published","is_active"].includes(k))d[k]=d[k]==="true";if(["release_year","duration_minutes","season_number","episode_number"].includes(k))d[k]=d[k]===""?null:Number(d[k]);if(["poster_url","backdrop_url","video_url","destination_url"].includes(k)){if(d[k]&&!urlSafe(d[k]))throw Error("Use URLs HTTPS válidas no campo "+k);if(!d[k])d[k]=null;}}return d;}
async function saveEntity(form,table){let id=form.dataset.id,d=dataForm(form);let req=id?api("/rest/v1/"+table+"?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify(d)}):api("/rest/v1/"+table,{method:"POST",body:JSON.stringify(d)});await req;await refresh();showAdmin();toast("Alterações salvas no Supabase.");}
async function deleteEntity(table,id){if(!confirm("Excluir permanentemente este registro?"))return;await api("/rest/v1/"+table+"?id=eq."+encodeURIComponent(id),{method:"DELETE"});await refresh();showAdmin();toast("Registro excluído.");}
document.addEventListener("click",async ev=>{let el=ev.target.closest("button,[data-nav],#adminLink");if(!el)return;try{
if(el.dataset.close!==undefined){closeModal();return;}
if(el.id==="retryCatalog"){refresh();return;}
if(el.dataset.nav){navigate(el.dataset.nav);return;}
if(el.dataset.title){openDetails(el.dataset.title);return;}
if(el.dataset.watch){play(el.dataset.watch);return;}
if(el.dataset.episode){let e=episodes.find(x=>x.id===el.dataset.episode);if(e)play(e.title_id,e.id);return;}
if(el.dataset.favorite){favorite(el.dataset.favorite);return;}
if(el.dataset.rate){rate(el.dataset.rate,Number(el.dataset.value));return;}
if(el.dataset.genre){selectedGenre=el.dataset.genre;document.querySelectorAll("[data-genre]").forEach(x=>x.classList.toggle("active",x.dataset.genre===selectedGenre));drawGallery(currentView);return;}
if(el.dataset.profile){store.active=el.dataset.profile;saveStore();closeModal();render();toast("Perfil alterado para "+profile().name);return;}
if(el.id==="addProfile"){let x=document.getElementById("newProfile"),name=x.value.trim();if(!name)return toast("Informe o nome do perfil.");if(store.profiles.length>=4)return toast("Limite de 4 perfis.");let id="p"+Date.now();store.profiles.push({id,name});store.active=id;saveStore();closeModal();render();toast("Perfil criado.");return;}
if(el.id==="profileButton"){manageProfiles();return;}
if(el.id==="searchIcon"){navigate("explorar");document.getElementById("query")?.focus();return;}
if(el.id==="adminLink"){ev.preventDefault();showAdmin();return;}
if(el.id==="newTitle"){titleForm();return;}if(el.id==="newEpisode"){episodeForm();return;}if(el.id==="newSponsor"){sponsorForm();return;}
if(el.dataset.edit){titleForm(el.dataset.edit);return;}if(el.dataset.editEpisode){episodeForm(el.dataset.editEpisode);return;}if(el.dataset.editSponsor){sponsorForm(el.dataset.editSponsor);return;}
if(el.dataset.remove){await deleteEntity("titles",el.dataset.remove);return;}if(el.dataset.removeEpisode){await deleteEntity("episodes",el.dataset.removeEpisode);return;}if(el.dataset.removeSponsor){await deleteEntity("sponsors",el.dataset.removeSponsor);return;}
if(el.id==="logoutAdmin"){adminToken=null;adminUser=null;showAdmin();toast("Sessão administrativa encerrada.");return;}
}catch(e){toast(e.message);console.error(e);}});
document.addEventListener("input",e=>{if(e.target.id==="query"){window.__searchValue=e.target.value;drawGallery(currentView)}});
document.addEventListener("submit",async e=>{if(!["loginForm","titleForm","episodeForm","sponsorForm"].includes(e.target.id))return;e.preventDefault();const form=e.target;const submit=form.querySelector('[type="submit"]');submit.disabled=true;try{
if(form.id==="loginForm"){let email=document.getElementById("adminEmail").value,password=document.getElementById("adminPass").value;let r=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password})});if(!r.access_token)throw Error("Não foi possível autenticar.");adminToken=r.access_token;const permission=await api("/rest/v1/admin_users?select=user_id&user_id=eq."+encodeURIComponent(r.user.id));if(!permission.length){adminToken=null;throw Error("Este usuário não possui autorização administrativa. Cadastre seu UUID na tabela admin_users.")}adminUser=r.user;await refresh();showAdmin();toast("Acesso autorizado.");return;}
if(form.id==="titleForm")await saveEntity(form,"titles");if(form.id==="episodeForm")await saveEntity(form,"episodes");if(form.id==="sponsorForm")await saveEntity(form,"sponsors");
}catch(err){toast(err.message);console.error(err);}finally{submit.disabled=false;}});
overlay.addEventListener("click",e=>{if(e.target.id==="modalWrap")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
refresh();
</script></body></html>
