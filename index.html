.hero{min-height:clamp(440px,52vw,650px);display:flex;align-items:end;position:relative;isolation:isolate;padding:70px clamp(18px,5vw,80px) 66px;background:#0b0809;overflow:hidden}.heroimage{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:65% 35%;transform:scale(1.025)}.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#000 1%,rgba(0,0,0,.92) 30%,rgba(0,0,0,.4) 75%),linear-gradient(0deg,#000 0%,transparent 55%)}.herotext{max-width:700px}.eyebrow{font-size:12px;letter-spacing:2.7px;text-transform:uppercase;font-weight:800;color:#ff656a}.herotitle{font:900 clamp(43px,7vw,94px)/.98 Outfit,sans-serif;letter-spacing:-3px;margin:15px 0}.meta{color:#ddd;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:700}.meta .pill{border:1px solid #aaa;padding:3px 5px;border-radius:3px}.hero p{font-size:clamp(14px,1.5vw,17px);line-height:1.65;color:#e4e2e2;max-width:580px;margin:19px 0 26px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:13px 20px;font-weight:800;display:inline-flex;justify-content:center;align-items:center;gap:9px;background:#303036;color:#fff;min-height:44px}.btn.red{background:var(--red)}.btn.red:hover{background:#f3212c}.btn:hover{filter:brightness(1.2)}.btn.outline{background:transparent;border:1px solid #484850}.btn.small{font-size:12px;padding:9px 13px;min-height:35px}

.breadcrumb{border:0;color:#c4c4ce;background:transparent;padding:16px 0}.detailshero{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,42%);align-items:center;gap:30px;padding:28px 0 45px}.detailshero .cover{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:16px;box-shadow:0 0 50px rgba(200,0,0,.12)}.detailshero h1{font:900 clamp(35px,5vw,68px)/1 Outfit;margin:15px 0 17px}.detailshero p{line-height:1.7;color:#d1d1d7}.smallmuted{color:var(--muted);font-size:12px}.box{background:#111115;border:1px solid #28282e;border-radius:15px;padding:21px;margin:18px 0}.box h3{margin-top:0}.episode{display:flex;align-items:center;gap:14px;padding:13px;border-radius:10px;border:1px solid #303035;background:#17171b;color:#fff;text-align:left;width:100%;margin-bottom:9px}.episode:hover{border-color:var(--red)}.episode .number{background:#3a1518;border-radius:8px;padding:14px;color:#ff7b82;font-weight:900}.stars{display:flex;gap:4px}.star{border:0;background:transparent;color:#666;font-size:30px;padding:0 4px}.star.selected{color:#ffbb41}

2px;z-index:25;background:#9f101a;color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:800;box-shadow:0 9px 25px #0009}.hidden{display:none!important}.loading{padding:40px 0;color:#999}.toast{position:fixed;z-index:60;bottom:20px;left:50%;transform:translateX(-50%);padding:13px 20px;background:#29292e;border:1px solid #5b5b62;border-radius:11px;box-shadow:0 12px 35px #000;color:#fff;max-width:90vw;text-align:center}

<script type="module">
const URL_BASE="https://bpipdcbwlllwnvolorfp.supabase.co";
const API_KEY="sb_publishable_IrhYV4Ma_ENch1cvlTSy2g_4zTg5qkk";
const app=document.getElementById("app"),overlay=document.getElementById("overlay");
let titles=[],episodes=[],sponsors=[],featured=null,featuredIndex=0,adminToken=null,adminUser=null,adminMode=false,selectedGenre="Todos",loadError=null;
let tmdbFeed=[],tmdbMovies=[],tmdbSeries=[],tmdbLoaded=false,tmdbDemo=false;
const storeKey="morillaflix_v1";
function loadStore(){try{let x=JSON.parse(localStorage.getItem(storeKey));return x&&typeof x==="object"?x:{};}catch{return {};}}
let store=Object.assign({profiles:[{id:"principal",name:"Principal"}],active:"principal",data:{}},loadStore());
function saveStore(){localStorage.setItem(storeKey,JSON.stringify(store));}
function profile(){return store.profiles.find(p=>p.id===store.active)||store.profiles[0];}
function pdata(){store.data[store.active]??={favorites:[],history:{},ratings:{}};return store.data[store.active];}
function safe(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function urlSafe(raw){try{let u=new URL(raw);return u.protocol==="https:"?u.href:"";}catch{return "";}}
function img(raw){return urlSafe(raw)||"";}
function toast(t){let e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3300);}
async function api(path,options={}){const headers={"apikey":API_KEY,"Content-Type":"application/json",...(adminToken?{'Authorization':'Bearer '+adminToken}:{}),'Prefer':'return=representation',...options.headers};const res=await fetch(URL_BASE+path,{...options,headers});let data;try{data=await res.json()}catch{data=null}if(!res.ok)throw Error(data?.message||data?.error_description||data?.msg||"Erro ao acessar o servidor ("+res.status+")");return data;}
async function refresh(){
try{
 const [a,b,c]=await Promise.all([
 api("/rest/v1/titles?select=*&order=created_at.desc"),
 api("/rest/v1/episodes?select=*&order=season_number.asc,episode_number.asc"),
 api("/rest/v1/sponsors?select=*&order=created_at.desc")
 ]);
 titles=a||[];episodes=b||[];sponsors=c||[];
 featured=titles.find(x=>x.featured)||titles[0]||null;
 loadError=null;
 try{localStorage.setItem("morilla_catalog_cache_v2",JSON.stringify({titles,episodes,sponsors}));}catch{}
}catch(e){
 console.error("Morilla Flix: erro no catálogo",e);
 loadError=e.message;
 try{
 const cached=JSON.parse(localStorage.getItem("morilla_catalog_cache_v2")||"null");
 if(cached?.titles?.length){titles=cached.titles;episodes=cached.episodes||[];sponsors=cached.sponsors||[];featured=titles.find(x=>x.featured)||titles[0];toast("Exibindo catálogo salvo. Sem conexão com o Supabase.");}
 }catch{}
}
render();
}
function titleBy(id){return titles.find(x=>x.id===id);}
function tmdbImage(path,size="w780"){return path && /^\/[A-Za-z0-9_.-]+\.(?:jpg|png|webp)$/.test(path) ? "https://image.tmdb.org/t/p/"+size+path : "assets/poster-fallback.svg";}
function tmdbCard(t){
 const key=t.media_type+":"+t.id;
 const genre=t.media_type==="tv"?"SÉRIE":"FILME";
 return '<button class="movie tmdb-movie" data-tmdb="'+safe(key)+'"><img class="thumb" loading="lazy" src="'+safe(tmdbImage(t.backdrop_path||t.poster_path))+'" alt="Capa de '+safe(t.title)+'" onerror="this.onerror=null;this.src=\'assets/poster-fallback.svg\'"><span class="chip">'+genre+'</span><div class="details"><h3>'+safe(t.title)+'</h3><p>'+safe((t.release_date||"").slice(0,4))+' · Informações TMDB</p></div></button>';
}
function tmdbShelf(label,list){return list.length?'<section class="section tmdb-shelf"><h2 class="heading">'+safe(label)+'</h2><div class="shelf">'+list.map(tmdbCard).join("")+'</div></section>':"";}
function tmdbCredits(){return '<div class="tmdb-credits"><a target="_blank" rel="noopener noreferrer" href="https://www.themoviedb.org"><img src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg" alt="TMDB — The Movie Database" width="90"></a><p>This product uses the TMDB API but is not endorsed or certified by TMDB.<br>Os títulos desta seção são informativos. A exibição de filmes completos exige licença própria.</p></div>';}
async function loadTmdb(){
 if(tmdbLoaded)return;
 tmdbLoaded=true;
 try{
 const r=await fetch("/api/tmdb?category=trending",{headers:{"Accept":"application/json"}});
 if(!r.ok)return;
 const json=await r.json();
 if(!json.enabled||!Array.isArray(json.results))return;
 tmdbFeed=json.results;tmdbDemo=Boolean(json.demo);
 const [movies,series]=await Promise.all([
 fetch("/api/tmdb?category=movies").then(x=>x.ok?x.json():null).catch(()=>null),
 fetch("/api/tmdb?category=series").then(x=>x.ok?x.json():null).catch(()=>null)
 ]);
 tmdbMovies=movies?.results||[];
 tmdbSeries=series?.results||[];
 render();
 }catch(err){console.info("Catálogo TMDB opcional indisponível.");}
}
function tmdbDetails(key){
 const [type,id]=key.split(":");
 const all=[...tmdbFeed,...tmdbMovies,...tmdbSeries];
 const t=all.find(x=>x.media_type===type&&String(x.id)===id);
 if(!t)return toast("Informações não disponíveis.");
 const href="https://www.themoviedb.org/"+(type==="tv"?"tv/":"movie/")+encodeURIComponent(String(t.id));
 showModal('<div class="tmdb-details"><img src="'+safe(tmdbImage(t.backdrop_path||t.poster_path,"w780"))+'" alt="" onerror="this.onerror=null;this.src=\'assets/poster-fallback.svg\'"><h2>'+safe(t.title)+'</h2><p class="smallmuted">'+safe((t.release_date||"").slice(0,4))+' · Nota TMDB: '+safe((Number(t.vote_average)||0).toFixed(1))+'/10</p><p>'+safe(t.description||"Descrição indisponível.")+'</p><div class="notice">Este item é uma ficha de catálogo, não um vídeo liberado para reprodução.</div><a class="btn outline" href="'+safe(href)+'" target="_blank" rel="noopener noreferrer">Ver informações no TMDB ↗</a></div>');
}

function mediaCard(t){
 const score=Object.values(store.data).flatMap(x=>x.ratings?.[t.id]?[x.ratings[t.id]]:[]);
 const rate=score.length?(score.reduce((a,b)=>a+b,0)/score.length).toFixed(1):"";
 const hasVideo=Boolean(t.video_url)||episodes.some(e=>e.title_id===t.id && e.video_url);
 return '<article class="movie" data-is-series="'+(t.kind==="series"?"true":"false")+'"><img class="thumb" loading="lazy" src="'+safe(img(t.poster_url||t.backdrop_url))+'" alt="Capa de '+safe(t.name)+'" onerror="this.onerror=null;this.src=\'assets/poster-fallback.svg\'"><span class="chip">'+(t.kind==="series"?"COLEÇÃO":"FILME")+'</span>'+(rate?'<span class="badgerating">★ '+rate+'</span>':"")+'<div class="details"><h3>'+safe(t.name)+'</h3><p>'+safe(t.release_year||"")+' · '+safe(t.genre)+'</p></div><button class="poster-open" data-title="'+safe(t.id)+'" aria-label="Ver detalhes de '+safe(t.name)+'"></button>'+(hasVideo?'<button class="poster-play" data-watch="'+safe(t.id)+'" aria-label="Assistir '+safe(t.name)+'">▶</button>':"")+'</article>';
}
function shelf(label,list){return list.length?'<section class="section"><h2 class="heading">'+safe(label)+'</h2><div class="shelf">'+list.map(mediaCard).join("")+'</div></section>':"";}
function sponsorBlock(){const s=sponsors.find(x=>x.is_active);if(!s)return"";const link=urlSafe(s.destination_url);return '<section class="sponsor"><div><span class="sptag">CONTEÚDO PATROCINADO</span><h3>'+safe(s.heading)+'</h3><p>'+safe(s.description)+'</p></div>'+(link?'<a class="btn small outline" target="_blank" rel="noopener noreferrer sponsored" href="'+safe(link)+'">Conhecer patrocinador ↗</a>':"")+'</section>';}

function recommendScore(t){let d=pdata(),ratings=Object.entries(d.ratings),favs=d.favorites.map(titleBy).filter(Boolean),liked=ratings.filter(([id,n])=>n>=4).map(([id])=>titleBy(id)).filter(Boolean),same=[...favs,...liked];return (same.filter(x=>x.genre===t.genre).length*3)+(t.featured?2:0)+(d.history[t.id]?1:0)+(d.favorites.includes(t.id)?-5:0);}

function details(id){const t=titleBy(id);if(!t)return home();const d=pdata(),stars=d.ratings[t.id]||0,list=episodes.filter(e=>e.title_id===id);return '<div class="content"><button class="breadcrumb" data-nav="inicio">← Voltar ao início</button><div class="detailshero"><div><div class="eyebrow">'+(t.kind==="series"?"SÉRIE ORIGINAL DO CATÁLOGO":"CINEMA PARA TODOS")+'</div><h1>'+safe(t.name)+'</h1><div class="meta"><span>'+safe(t.release_year||"")+'</span><span class="pill">'+safe(t.age_rating)+'</span><span>'+safe(t.genre)+'</span><span>'+safe(t.duration_minutes||"")+" min"+'</span></div><p>'+safe(t.description)+'</p><div class="actions"><button class="btn red" data-watch="'+safe(t.id)+'">▶ '+(d.history[t.id]?.position>5?"Continuar assistindo":"Assistir agora")+'</button><button class="btn outline" data-favorite="'+safe(t.id)+'">'+(d.favorites.includes(t.id)?"✓ Remover da lista":"+ Minha lista")+'</button></div><p class="smallmuted" style="margin-top:21px">'+safe(t.credit||"Verifique os direitos de exibição.")+'</p></div><img class="cover" src="'+safe(img(t.backdrop_url||t.poster_url))+'" alt="'+safe(t.name)+'"></div>'+(list.length?'<section class="box"><h2>Temporadas e episódios</h2>'+list.map(e=>'<button class="episode" data-episode="'+safe(e.id)+'"><span class="number">'+e.season_number+'×'+e.episode_number+'</span><span><strong>'+safe(e.name)+'</strong><br><span class="smallmuted">'+safe(e.description)+' · '+safe(e.duration_minutes||"")+' min</span></span><span style="margin-left:auto">▶</span></button>').join("")+'</section>':"")+'<section class="box"><h3>Sua avaliação</h3><p class="smallmuted">As notas são pessoais e ficam somente neste navegador.</p><div class="stars">'+[1,2,3,4,5].map(n=>'<button class="star '+(n<=stars?"selected":"")+'" data-rate="'+safe(t.id)+'" data-value="'+n+'" aria-label="Avaliar com '+n+' estrelas">★</button>').join("")+'</div></section>'+shelf("Você também pode gostar",titles.filter(x=>x.id!==t.id).sort((a,b)=>Number(b.genre===t.genre) function closeModal(){const v=overlay.querySelector("video");if(v)v.pause();overlay.innerHTML="";}function trackVideo(id,video,episodeId){
 const d=pdata(),key=cinemaResumeKey(id,episodeId);
 const record={position:video.currentTime||0,percent:video.duration?Math.floor(100*video.currentTime/video.duration):0};
 d.history[key]=record;d.history[id]=record;saveStore();
}

function youtubeEmbed(url){try{const u=new URL(url);let id=null;if(u.hostname==="youtu.be")id=u.pathname.slice(1);if(["youtube.com","www.youtube.com","m.youtube.com"].includes(u.hostname)){id=u.searchParams.get("v");if(u.pathname.startsWith("/embed/"))id=u.pathname.split("/")[2]}return /^[a-zA-Z0-9_-]{11}$/.test(id||"")?"https://www.youtube-nocookie.com/embed/"+id:null;}catch{return null;}}
function cinemaResumeKey(id,episodeId){return episodeId ? id+":"+episodeId : id;}
function cinemaSeek(seconds){
 const video=document.getElementById("cinemaVideo");
 if(!video || !Number.isFinite(video.duration))return;
 video.currentTime=Math.max(0,Math.min(video.duration,video.currentTime+seconds));
}
function cinemaAction(action){
 const video=document.getElementById("cinemaVideo");
 const stage=document.getElementById("cinemaStage");
 if(action==="fullscreen"){
  if(!stage?.requestFullscreen)return toast("Seu navegador não oferece tela cheia.");
  if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});
  else stage.requestFullscreen().catch(()=>toast("Não foi possível abrir a tela cheia."));
 }
 if(!video)return;
 if(action==="pip"){
  if(document.pictureInPictureElement)document.exitPictureInPicture?.().catch(()=>{});
  else if(typeof video.requestPictureInPicture==="function")video.requestPictureInPicture().catch(()=>toast("Modo janela indisponível."));
  else toast("Seu navegador não oferece o modo janela.");
 }
 if(action==="speed"){
  const speeds=[1,1.25,1.5,2];
  let idx=speeds.findIndex(s=>s===video.playbackRate);
  video.playbackRate=speeds[(idx+1)%speeds.length];
  const label=document.getElementById("cinemaSpeed");if(label)label.textContent=video.playbackRate+"×";
 }
 if(action==="back")cinemaSeek(-10);
 if(action==="forward")cinemaSeek(10);
}
function play(id,episodeId){
 const t=titleBy(id);if(!t)return;
 const epList=episodes.filter(e=>e.title_id===id && e.published && e.video_url)
  .sort((a,b)=>(a.season_number-b.season_number)||(a.episode_number-b.episode_number));
 const chosen=episodeId?epList.find(e=>e.id===episodeId):epList[0];
 const link=chosen?.video_url||t.video_url;
 if(!link)return toast("Este título ainda não tem vídeo liberado.");
 const embed=youtubeEmbed(link);
 const direct=urlSafe(link);
 if(!embed&&!direct)return toast("A origem do vídeo não tem uma URL HTTPS válida.");
 const idx=chosen?epList.findIndex(x=>x.id===chosen.id):-1;
 const next=idx>=0?epList[idx+1]:null,prev=idx>0?epList[idx-1]:null;
 const title=t.name+(chosen?" · "+chosen.name:"");
 const epTag=chosen?"Temporada "+chosen.season_number+" · Episódio "+chosen.episode_number:"Filme completo";
 const videoBox=embed?
 '<iframe class="videoembed" id="cinemaEmbed" src="'+safe(embed)+'" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="Player oficial de '+safe(title)+'"></iframe>':
 '<video id="cinemaVideo" playsinline controls autoplay preload="metadata" poster="'+safe(img(t.backdrop_url||t.poster_url))+'" src="'+safe(direct)+'"></video>';
 const nextButton=next?'<button class="btn primary" data-watch-episode="'+safe(next.id)+'" data-title-id="'+safe(id)+'">▶ Próximo episódio</button>':"";
 const epButtons=epList.length?'<section class="cinema-episodes"><h3>Episódios</h3><div class="cinema-episode-grid">'+epList.map((e,i)=>'<button class="cinema-episode '+(e.id===chosen?.id?"active":"")+'" data-watch-episode="'+safe(e.id)+'" data-title-id="'+safe(id)+'"><b>'+safe(e.episode_number)+'</b><span><strong>'+safe(e.name)+'</strong><small>T'+e.season_number+' · E'+e.episode_number+' · '+safe(e.duration_minutes||"")+' min</small></span><span class="ep-play">▶</span></button>').join("")+'</div></section>':"";
 const errorLink=embed?"https://www.youtube.com/watch?v="+(embed.split("/embed/")[1]||""):direct;
 const markup='<div class="cinema-overlay" role="dialog" aria-modal="true" aria-label="Assistindo '+safe(title)+'"><div class="cinema-shell">'+
 '<div class="cinema-header"><button class="cinema-back" data-close aria-label="Voltar">←</button><div class="cinema-brand">MORILLA <strong>FLIX</strong></div><div class="cinema-heading"><strong>'+safe(t.name)+'</strong><small>'+safe(epTag)+'</small></div><div class="cinema-label"><i></i> CONTEÚDO AUTORIZADO</div></div>'+
 '<div class="cinema-stage" id="cinemaStage"><div class="cinema-screen">'+videoBox+'<div class="cinema-error" id="cinemaError" hidden><h3>Não foi possível reproduzir</h3><p>A origem do vídeo não respondeu. Você pode abrir o arquivo no provedor original.</p><a class="btn red" target="_blank" rel="noopener noreferrer" href="'+safe(errorLink)+'">Abrir vídeo na origem ↗</a></div></div></div>'+
 '<div class="cinema-controls"><button class="btn outline" data-player-action="back">↶ 10s</button><button class="btn outline" data-player-action="forward">10s ↷</button><button class="btn outline" data-player-action="speed" id="cinemaSpeed">1×</button><span class="spacer"></span><button class="btn outline" data-player-action="pip">▣ Janela</button><button class="btn outline" data-player-action="fullscreen">⛶ Tela cheia</button>'+nextButton+'</div>'+
 '<div class="cinema-details"><div class="cinema-kicker">MORILLA FLIX · CINEMA ABERTO</div><h2>'+safe(t.name)+'</h2><div class="cinema-meta"><span>'+safe(t.release_year||"")+'</span><span>'+safe(epTag)+'</span><span>'+safe(t.genre)+'</span><span>HD</span></div><p class="cinema-description">'+safe(chosen?.description||t.description)+'</p><p class="cinema-credit">'+safe(t.credit||"Conteúdo disponibilizado com autorização.")+'</p>'+epButtons+'<section class="cinema-upnext"><h3>Você também pode assistir</h3>'+shelf("Outros filmes liberados",titles.filter(x=>x.id!==id&&x.video_url).slice(0,8))+'</section></div></div></div>';
 const old=overlay.querySelector("video"); if(old)old.pause();
 overlay.innerHTML=markup;
 const video=document.getElementById("cinemaVideo");
 if(!video)return;
 const d=pdata(),key=cinemaResumeKey(id,chosen?.id),resume=d.history[key]?.position||d.history[id]?.position||0;
 let lastSaved=-1;
 video.addEventListener("loadedmetadata",()=>{
  if(resume>12&&resume<video.duration-8){
   try{video.currentTime=resume;toast("Retomando de "+Math.floor(resume/60)+"m "+Math.floor(resume%60)+"s");}catch{}
  }
  video.play().catch(()=>{});
 });
 video.addEventListener("timeupdate",()=>{
  if(Math.floor(video.currentTime/4)!==lastSaved){lastSaved=Math.floor(video.currentTime/4);trackVideo(id,video,chosen?.id);}
 });
 video.addEventListener("pause",()=>trackVideo(id,video,chosen?.id));
 video.addEventListener("error",()=>{document.getElementById("cinemaError")?.removeAttribute("hidden");});
 video.addEventListener("ended",()=>{
  const d=pdata();
  d.history[key]={position:0,percent:100};d.history[id]={position:0,percent:100};saveStore();
  if(next)toast("Episódio concluído! Você pode iniciar o próximo.");
  else toast("Filme concluído. Obrigado por assistir!");
 });
}

function adminDashboard(){return '<div class="notice ok">Acesso de administrador autenticado.</div><div class="actions" style="margin:12px 0"><button class="btn red" id="newTitle">+ Novo filme/série</button><button class="btn outline" id="newEpisode">+ Episódio</button><button class="btn outline" id="newSponsor">+ Patrocínio</button><button class="btn" id="logoutAdmin">Sair</button></div><h3>Catálogo cadastrado</h3>'+titles.map(t=>'<div class="episode"><div style="flex:1"><strong>'+safe(t.name)+'</strong><div class="smallmuted">'+safe(t.kind)+' · '+(t.published?"Publicado":"Rascunho")+'</div></div><button class="btn small" data-edit="'+safe(t.id)+'">Editar</button><button class="btn small outline" data-remove="'+safe(t.id)+'">Excluir</button></div>').join("")+'<h3>Episódios</h3>'+episodes.map(e=>'<div class="episode"><div style="flex:1"><strong>'+safe(e.name)+'</strong><div class="smallmuted">'+safe(titleBy(e.title_id)?.name)+' · T'+e.season_number+' E'+e.episode_number+'</div></div><button class="btn small" data-edit-episode="'+safe(e.id)+'">Editar</button><button class="btn small outline" data-remove-episode="'+safe(e.id)+'">Excluir</button></div>').join("")+'<h3>Patrocinadores</h3>'+sponsors.map(s=>'<div class="episode"><div style="flex:1"><strong>'+safe(s.heading)+'</strong><div class="smallmuted">'+(s.is_active?"Ativo":"Inativo")+'</div></div><button class="btn small" data-edit-sponsor="'+safe(s.id)+'">Editar</button><button class="btn small outline" data-remove-sponsor="'+safe(s.id)+'">Excluir</button></div>').join("");}
function titleForm(id){let t=id?titleBy(id):{};if(!t)return;showModal('<h2>'+(id?"Editar título":"Novo título")+'</h2><form id="titleForm" data-id="'+safe(id||"")+'"><div class="formgrid">'+field("name","Nome",t.name||"",true)+field("slug","Slug (letras minúsculas e hífens)",t.slug||"",true)+selectField("kind","Tipo",[["movie","Filme"],["series","Série"]],t.kind||"movie")+field("genre","Gênero",t.genre||"Drama",true)+field("release_year","Ano",t.release_year||"",false,"number")+field("duration_minutes","Duração (min)",t.duration_minutes||"",false,"number")+field("age_rating","Classificação",t.age_rating||"L")+field("poster_url","URL HTTPS da capa",t.poster_url||"")+field("backdrop_url","URL HTTPS do banner",t.backdrop_url||"")+field("video_url","URL HTTPS do vídeo",t.video_url||"")+field("credit","Créditos e licenças",t.credit||"")+'<label class="field formwide">Sinopse<textarea name="description" rows="3">'+safe(t.description||"")+'</textarea></label>'+selectField("featured","Destaque",[["true","Sim"],["false","Não"]],String(t.featured||false))+selectField("published","Publicado",[["true","Sim"],["false","Não"]],String(t.published??true))+'</div><p class="smallmuted">Use somente vídeos próprios ou com autorização de exibição. Links MP4/WebM HTTPS e YouTube são aceitos.</p><button class="btn red" type="submit">Salvar título</button></form>');}
function field(name,label,value,required=false,type="text"){return '<label class="field">'+safe(label)+'<input name="'+name+'" type="'+type+'" value="'+safe(value)+'" '+(required?"required":"")+'></label>';}
function selectField(name,label,options,value){return '<label class="field">'+safe(label)+'<select name="'+name+'">'+options.map(([key,name])=>'<option value="'+safe(key)+'" '+(String(key)===String(value)?"selected":"")+'>'+safe(name)+'</option>').join("")+'</select></label>';}
function episodeForm(id){let e=id?episodes.find(x=>x.id===id):{};if(!e)return;showModal('<h2>'+(id?"Editar episódio":"Novo episódio")+'</h2><form id="episodeForm" data-id="'+safe(id||"")+'"><div class="formgrid">'+selectField("title_id","Série",titles.filter(t=>t.kind==="series").map(t=>[t.id,t.name]),e.title_id||"")+field("name","Nome do episódio",e.name||"",true)+field("season_number","Temporada",e.season_number||1,true,"number")+field("episode_number","Episódio",e.episode_number||1,true,"number")+field("duration_minutes","Duração (min)",e.duration_minutes||"",false,"number")+field("video_url","URL HTTPS do vídeo",e.video_url||"")+'<label class="field formwide">Sinopse<textarea name="description" rows="3">'+safe(e.description||"")+'</textarea></label>'+selectField("published","Publicado",[["true","Sim"],["false","Não"]],String(e.published??true))+'</div><button class="btn red" type="submit">Salvar episódio</button></form>');}
function sponsorForm(id){let s=id?sponsors.find(x=>x.id===id):{};if(!s)return;showModal('<h2>'+(id?"Editar patrocínio":"Novo patrocínio")+'</h2><form id="sponsorForm" data-id="'+safe(id||"")+'">'+field("heading","Título",s.heading||"",true)+field("description","Descrição",s.description||"")+field("destination_url","URL HTTPS do anunciante",s.destination_url||"")+selectField("is_active","Ativo",[["true","Sim"],["false","Não"]],String(s.is_active||false))+'<p class="smallmuted">Anúncios visíveis somente em cartão identificado. Sem popups ou redirecionamentos forçados.</p><button class="btn red" type="submit">Salvar patrocínio</button></form>');}
function dataForm(form){let d=Object.fromEntries(new FormData(form));for(let k of Object.keys(d)){if(["featured","published","is_active"].includes(k))d[k]=d[k]==="true";if(["release_year","duration_minutes","season_number","episode_number"].includes(k))d[k]=d[k]===""?null:Number(d[k]);if(["poster_url","backdrop_url","video_url","destination_url"].includes(k)){if(d[k]&&!urlSafe(d[k]))throw Error("Use URLs HTTPS válidas no campo "+k);if(!d[k])d[k]=null;}}return d;}
async function saveEntity(form,table){let id=form.dataset.id,d=dataForm(form);let req=id?api("/rest/v1/"+table+"?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify(d)}):api("/rest/v1/"+table,{method:"POST",body:JSON.stringify(d)});await req;await refresh();showAdmin();toast("Alterações salvas no Supabase.");}
async function deleteEntity(table,id){if(!confirm("Excluir permanentemente este registro?"))return;await api("/rest/v1/"+table+"?id=eq."+encodeURIComponent(id),{method:"DELETE"});await refresh();showAdmin();toast("Registro excluído.");}
document.addEventListener("click",async ev=>{let el=ev.target.closest("button,[data-nav],#adminLink");if(!el)return;try{
if(el.dataset.close!==undefined){closeModal();return;}
if(el.id==="retryCatalog"){refresh();return;}
if(el.dataset.slide!==undefined){featuredIndex=Number(el.dataset.slide);render();return;}
if(el.dataset.nav){navigate(el.dataset.nav);return;}
if(el.dataset.title){openDetails(el.dataset.title);return;}
if(el.dataset.tmdb){tmdbDetails(el.dataset.tmdb);return;}
if(el.dataset.watch){play(el.dataset.watch);return;}
if(el.dataset.episode){let e=episodes.find(x=>x.id===el.dataset.episode);if(e)play(e.title_id,e.id);return;}
if(el.dataset.watchEpisode){play(el.dataset.titleId,el.dataset.watchEpisode);return;}
if(el.dataset.playerAction){cinemaAction(el.dataset.playerAction);return;}
if(el.dataset.favorite){favorite(el.dataset.favorite);return;}
if(el.dataset.rate){rate(el.dataset.rate,Number(el.dataset.value));return;}
if(el.dataset.genre){selectedGenre=el.dataset.genre;document.querySelectorAll("[data-genre]").forEach(x=>x.classList.toggle("active",x.dataset.genre===selectedGenre));drawGallery(currentView);return;}
if(el.dataset.profile){store.active=el.dataset.profile;saveStore();closeModal();render();toast("Perfil alterado para "+profile().name);return;}
if(el.id==="addProfile"){let x=document.getElementById("newProfile"),name=x.value.trim();if(!name)return toast("Informe o nome do perfil.");if(store.profiles.length>=4)return toast("Limite de 4 perfis.");let id="p"+Date.now();store.profiles.push({id,name});store.active=id;saveStore();closeModal();render();toast("Perfil criado.");return;}
if(el.id==="profileButton"){manageProfiles();return;}
if(el.id==="searchIcon"){navigate("explorar");document.getElementById("query")?.focus();return;}
if(el.id==="adminLink"){ev.preventDefault();showAdmin();return;}
if(el.id==="newTitle"){titleForm();return;}if(el.id==="newEpisode"){episodeForm();return;}if(el.id==="newSponsor"){sponsorForm();return;}
if(el.dataset.edit){titleForm(el.dataset.edit);return;}if(el.dataset.editEpisode){episodeForm(el.dataset.editEpisode);return;}if(el.dataset.editSponsor){sponsorForm(el.dataset.editSponsor);return;}
if(el.dataset.remove){await deleteEntity("titles",el.dataset.remove);return;}if(el.dataset.removeEpisode){await deleteEntity("episodes",el.dataset.removeEpisode);return;}if(el.dataset.removeSponsor){await deleteEntity("sponsors",el.dataset.removeSponsor);return;}
if(el.id==="logoutAdmin"){adminToken=null;adminUser=null;showAdmin();toast("Sessão administrativa encerrada.");return;}
}catch(e){toast(e.message);console.error(e);}});
document.addEventListener("input",e=>{if(e.target.id==="query"){window.__searchValue=e.target.value;drawGallery(currentView)}});
document.addEventListener("submit",async e=>{if(!["loginForm","titleForm","episodeForm","sponsorForm"].includes(e.target.id))return;e.preventDefault();const form=e.target;const submit=form.querySelector('[type="submit"]');submit.disabled=true;try{
if(form.id==="loginForm"){let email=document.getElementById("adminEmail").value,password=document.getElementById("adminPass").value;let r=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password})});if(!r.access_token)throw Error("Não foi possível autenticar.");adminToken=r.access_token;const permission=await api("/rest/v1/admin_users?select=user_id&user_id=eq."+encodeURIComponent(r.user.id));if(!permission.length){adminToken=null;throw Error("Este usuário não possui autorização administrativa. Cadastre seu UUID na tabela admin_users.")}adminUser=r.user;await refresh();showAdmin();toast("Acesso autorizado.");return;}
if(form.id==="titleForm")await saveEntity(form,"titles");if(form.id==="episodeForm")await saveEntity(form,"episodes");if(form.id==="sponsorForm")await saveEntity(form,"sponsors");
}catch(err){toast(err.message);console.error(err);}finally{submit.disabled=false;}});
overlay.addEventListener("click",e=>{if(e.target.id==="modalWrap")closeModal();});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){closeModal();return;}
 if(!overlay.querySelector(".cinema-overlay") || ["INPUT","TEXTAREA"].includes(document.activeElement?.tagName))return;
 const video=document.getElementById("cinemaVideo");
 if(e.key==="ArrowLeft"){e.preventDefault();cinemaSeek(-10);}
 if(e.key==="ArrowRight"){e.preventDefault();cinemaSeek(10);}
 if(e.key===" "&&video){e.preventDefault();video.paused?video.play().catch(()=>{}):video.pause();}
 if(e.key.toLowerCase()==="f"){e.preventDefault();cinemaAction("fullscreen");}
});
refresh();
loadTmdb();
</script></body></html>
